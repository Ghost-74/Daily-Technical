<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
        }

        h2 {
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: none;
        }

        button {
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #38bdf8;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            background: #334155;
            margin: 5px 0;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .done {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .delete-btn {
            background: red;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>To-Do App</h2>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter task...">
        <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
</div>

<!-- Link JS file -->
<script src="script.js"></script>

</body>
</html>
